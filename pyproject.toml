[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toposhapes-sar-dem"
version = "0.1.0"
description = "Controlled synthetic DEM modification for GAMMA SAR/InSAR workflows"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.24",
  "xarray>=2023.1",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "pyproj>=3.5",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
interactive = [
  "plotly>=5.18",
  "ipywidgets>=8",
  "jupyterlab>=4",
]

test = [
  "pytest>=7",
]

[project.scripts]
toposhapes-gamma-processing = "toposhapes_sar.gamma_processing:main"
toposhapes-compare-simsar = "toposhapes_sar.compare_simsar_mli:main"
toposhapes-batch-simsar = "toposhapes_sar.batch_simsar_compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]