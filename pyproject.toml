[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toposhapes-sar-dem"
version = "0.1.0"
description = "Controlled synthetic DEM modification for GAMMA SAR/InSAR workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "xarray>=2023.1",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
